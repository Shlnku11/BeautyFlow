services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command:
      - bash
      - -lc
      - >-
        mongod --replSet rs0 --bind_ip_all &
        until mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; do sleep 1; done;
        mongosh --quiet --eval 'try { rs.status().ok } catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }); }';
        wait
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongo_data:
